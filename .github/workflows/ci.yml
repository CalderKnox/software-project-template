name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One runner: placeholder build, repo hygiene (prek), and documentation checks.
  # Replace the placeholder step with toolchain setup, then run test layers in
  # numeric order (see tests/README.md). Common setups:
  #
  # Node.js:
  #   - uses: actions/setup-node@v4
  #     with:
  #       node-version: 22
  #   - run: npm ci
  #   - run: npm run lint --if-present
  #   - run: npm test
  #
  # Python:
  #   - uses: actions/setup-python@v5
  #     with:
  #       python-version: "3.13"
  #   - run: pip install -r requirements.txt
  #   - run: pytest
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Placeholder (remove once real build and test steps exist)
        run: 'echo "TODO: add build, lint, and test steps for this project"'

      # prek-action installs the prek binary and hook environments.
      # Same hooks as .pre-commit-config.yaml, against the whole tree.
      - uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.5.x

      - name: Check documentation structure
        run: |
          set -euo pipefail
          docs_root=docs
          failures=0
          if [[ ! -d "$docs_root" ]]; then
            echo "docs-check: missing directory: $docs_root" >&2
            exit 1
          fi

          # One walk covers every directory, including section and subsection
          # indexes (docs/<section>/ and docs/<section>/<subsection>/).
          while IFS= read -r directory; do
            if [[ ! -f "$directory/README.md" ]]; then
              echo "docs-check: missing $directory/README.md" >&2
              failures=1
            fi
            if [[ ! -f "$directory/_template.md" ]]; then
              echo "docs-check: missing $directory/_template.md" >&2
              failures=1
            fi
          done < <(find "$docs_root" -type d -print)

          # grep -F (fixed-string) is used instead of rg because ripgrep is
          # not preinstalled on GitHub-hosted ubuntu-latest runners.
          while IFS='|' read -r file link; do
            if ! grep -Fq -- "$link" "$file"; then
              echo "docs-check: $file must contain link $link" >&2
              failures=1
            fi
          done <<'REQUIRED_LINKS'
          docs/01-adrs/README.md|../02-design/01-decisions/_template.md
          docs/02-design/README.md|../01-adrs/
          docs/02-design/00-architecture/README.md|](_template.md)
          docs/02-design/01-decisions/README.md|../../01-adrs/
          docs/04-playbooks/README.md|../06-guides/developer-guides/
          docs/04-playbooks/README.md|../05-runbooks/
          docs/05-runbooks/README.md|../07-reference/
          docs/06-guides/README.md|../04-playbooks/
          REQUIRED_LINKS

          if (( failures )); then
            exit 1
          fi

          echo "docs-check: all directories have README.md and _template.md"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
