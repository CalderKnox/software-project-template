name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Successful placeholder only. This job does not build or test anything.
  # Replace it before anyone treats it as a required test check, then run test
  # layers in numeric order (see tests/README.md). Common setups:
  #
  # Node.js:
  #   - uses: actions/setup-node@v4
  #     with:
  #       node-version: 22
  #   - run: npm ci
  #   - run: npm run lint --if-present
  #   - run: npm test
  #
  # Python:
  #   - uses: actions/setup-python@v5
  #     with:
  #       python-version: "3.13"
  #   - run: pip install -r requirements.txt
  #   - run: pytest
  toolchain:
    name: Toolchain (not configured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: This job does not build or test anything
        run: |
          echo "This job does not build or test anything and must be replaced before anyone treats it as a required test check."
          exit 0

  # prek-action installs the prek binary and hook environments.
  # Same hooks as .pre-commit-config.yaml, against the whole tree.
  prek:
    name: Lint (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.4"
