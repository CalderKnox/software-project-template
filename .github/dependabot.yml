version: 2

updates:
  # Keep GitHub Actions in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # CodeQL fails when init and analyze run different versions, so bump
      # every github/codeql-action step in a single pull request.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"

  # Add one block per language ecosystem used by this project, e.g.:
  #
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
