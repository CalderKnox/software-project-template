# Pre-commit hooks, executed by prek (https://github.com/j178/prek), a faster
# drop-in replacement for pre-commit.
#
# Local usage:
#   pip install 'prek==0.5.4'   # or: uv tool install 'prek==0.5.4'
#   brew install prek           # cannot pin 0.5.4; prefer pip or uv
#   prek install            # activate the git pre-commit hook
#   prek run --all-files    # run every hook against the whole tree
#
# CI runs the same set of hooks (see .github/workflows/ci.yml).
# Keep this file language-agnostic: add toolchain-specific hooks together
# with the project's build steps.

repos:
  # Sanity checks on this config itself.
  - repo: meta
    hooks:
      - id: check-useless-excludes

  # Generic file hygiene, useful for any project.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: docs-check
        name: Check documentation structure
        entry: bash scripts/docs-check.sh
        language: system
        pass_filenames: false
        always_run: true

# Markdown is linted in CI (see .markdownlint.yaml and
# .github/workflows/docs.yml), so it is intentionally not duplicated here.
